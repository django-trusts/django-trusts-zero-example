name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Django 6.1 and paired Zero/core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # trusts.zero.__init__ reads AUTH_USER_MODEL; do not import it
          # before Django settings exist. manage.py check proves the import.
          python -c "from importlib.metadata import distribution, version; import json; print('django-trusts', version('django-trusts'), json.loads(distribution('django-trusts').read_text('direct_url.json'))['vcs_info']['commit_id']); print('django-trusts-zero', version('django-trusts-zero'), json.loads(distribution('django-trusts-zero').read_text('direct_url.json'))['vcs_info']['commit_id'])"
      - name: Django system checks
        run: python manage.py check
      - name: Integration tests
        run: python manage.py test projects
      - name: Fresh migrate and seed
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
      - name: Collectstatic and serve admin CSS
        run: |
          python manage.py collectstatic --noinput --skip-checks
          test -f static/admin/css/base.css
          python scripts/verify_admin_static.py

  mysql-smoke:
    name: mysql 8 smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        # Django 6.1 requires MySQL 8.4+ (8.0.x raises NotSupportedError).
        image: mysql:8.4
        env:
          MYSQL_DATABASE: example
          MYSQL_USER: demo
          MYSQL_PASSWORD: demo
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://demo:demo@127.0.0.1:3306/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django 6.1 and paired Zero/core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # trusts.zero.__init__ reads AUTH_USER_MODEL; do not import it
          # before Django settings exist. manage.py check proves the import.
          python -c "from importlib.metadata import distribution, version; import json; print('django-trusts', version('django-trusts'), json.loads(distribution('django-trusts').read_text('direct_url.json'))['vcs_info']['commit_id']); print('django-trusts-zero', version('django-trusts-zero'), json.loads(distribution('django-trusts-zero').read_text('direct_url.json'))['vcs_info']['commit_id'])"
      - name: Django system checks
        run: python manage.py check
      - name: Migrate, seed, and permission query
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python scripts/mysql_smoke.py
