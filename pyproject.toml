[project]
name = "django-trusts-example"
version = "0.2.0.dev0"
description = "Runnable Django example that exercises django-trusts-zero"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@47ae25cffcfa542b3e4a2940f528a63fcb32062d",
    "django-trusts-zero @ git+https://github.com/django-trusts/django-trusts-zero.git@deee4bcf204b753ee851a939dd03fdcbe3828fcd",
    "gunicorn>=23.0.0",
    "PyMySQL[rsa]>=1.2.0",
    "dj-database-url>=2.3.0",
    "whitenoise>=6.9.0",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["example*", "projects*"]
