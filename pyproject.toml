[project]
name = "django-trusts-example"
version = "0.2.0.dev0"
description = "Runnable Django example that exercises django-trusts-zero"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@154dd32da822147fcada3782d0a0f92213e14705",
    "django-trusts-zero @ git+https://github.com/django-trusts/django-trusts-zero.git@66f21235988264f0ea23f3da45efb54cb768bf29",
    "gunicorn>=23.0.0",
    "PyMySQL[rsa]>=1.2.0",
    "dj-database-url>=2.3.0",
    "whitenoise>=6.9.0",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["example*", "projects*"]
