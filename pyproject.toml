[project]
name = "django-trusts-example"
version = "0.2.0.dev0"
description = "Runnable Django example that exercises django-trusts-zero"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@e9fd4cd4f77624f3d5351b505808c1d6fa8bcbc4",
    "django-trusts-zero @ git+https://github.com/django-trusts/django-trusts-zero.git@fb32d70e82f6a63d03287eb959732db52bd266c8",
    "gunicorn>=23.0.0",
    "PyMySQL[rsa]>=1.2.0",
    "dj-database-url>=2.3.0",
    "whitenoise>=6.9.0",
]

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
include = ["example*", "projects*"]
